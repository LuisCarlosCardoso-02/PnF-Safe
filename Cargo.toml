
[package]
name = "easyvault"
version = "0.1.0"
edition = "2024"

[dependencies]

# Cryptography
argon2 = "0.5"
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }

# Database
rusqlite = { version = "0.42", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Asynchronous operations (useful later)
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync"
] }

[dev-dependencies]
tempfile = "3"
